<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-lg shadow-md w-96">
  <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Connexion</h2>
  <form method="POST" action="/admin/login" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Nom d'utilisateur</label>
      <input
              type="text"
              name="username"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
      >
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Mot de passe</label>
      <input
              type="password"
              name="password"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
      >
    </div>
    <button
            type="submit"
            class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50"
    >
      Se connecter
    </button>
  </form>
</div>
</body>
</html>
